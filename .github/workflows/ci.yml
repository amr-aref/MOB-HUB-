name: MOB HUB CI

on:
  push:
    branches: [main, develop, 'fix/**', 'feat/**', 'release/**']
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Typecheck, lint, build, security policy
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm run typecheck

      - name: Lint
        run: pnpm run lint

      - name: Build
        run: pnpm run build
        env:
          PORT: "5173"
          BASE_PATH: "/"

      - name: Enforce reservation-only product model
        shell: bash
        run: |
          set -euo pipefail
          if git grep -n -i -E 'stripe|paymentIntent|payment_intent|checkout|createOrder|orderCheckout' -- ':!P2-UX-POLISH.md' ':!P2-UX-CHECKLIST.md'; then
            echo 'Forbidden purchase/payment implementation detected.' >&2
            exit 1
          fi

      - name: Verify no committed environment files
        shell: bash
        run: |
          set -euo pipefail
          if git ls-files | grep -E '(^|/)\.env($|\.)' | grep -v '\.env.example$'; then
            echo 'A real environment file is tracked in git.' >&2
            exit 1
          fi
