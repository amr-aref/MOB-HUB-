    # ─── Reservation schemas ──────────────────────────────────────────────────

    ReservationProductSnapshot:
      type: object
      description: Embedded product summary within a ReservationDto — avoids a second round-trip
      properties:
        nameAr: { type: string }
        nameEn: { type: string }
        price: { type: integer }
        imageColor: { type: string }
        brand: { type: string }
        model: { type: string }
      required: [nameAr, nameEn, price, imageColor, brand, model]

    ReservationStoreSnapshot:
      type: object
      description: Embedded store summary within a ReservationDto — avoids a second round-trip
      properties:
        nameAr: { type: string }
        nameEn: { type: string }
        logoColor: { type: string }
        logoInitial: { type: string }
        address: { type: string }
        phone: { type: string }
      required: [nameAr, nameEn, logoColor, logoInitial, address, phone]

    ReservationDto:
      type: object
      description: >
        Full reservation record with embedded product and store snapshots.
        Status values: pending | confirmed | declined | cancelled | expired | completed.
      properties:
        id: { type: string }
        productId: { type: string }
        product:
          $ref: "#/components/schemas/ReservationProductSnapshot"
        storeId: { type: string }
        store:
          $ref: "#/components/schemas/ReservationStoreSnapshot"
        buyerId: { type: string }
        conversationId:
          type: string
          nullable: true
        status: { type: string }
        cancelledBy:
          type: string
          nullable: true
          description: "Who cancelled: 'buyer' | 'merchant' | null"
        buyerNotes:
          type: string
          nullable: true
        merchantNotes:
          type: string
          nullable: true
        expiresAt: { type: string }
        confirmedAt:
          type: string
          nullable: true
        declinedAt:
          type: string
          nullable: true
        cancelledAt:
          type: string
          nullable: true
        completedAt:
          type: string
          nullable: true
        createdAt: { type: string }
        updatedAt: { type: string }
      required:
        - id
        - productId
        - product
        - storeId
        - store
        - buyerId
        - status
        - expiresAt
        - createdAt
        - updatedAt

    CreateReservationBody:
      type: object
      description: Request body for creating a reservation on a product.
      properties:
        buyerId:
          type: string
          description: Buyer's device UUID (anonymous identity until auth is added)
          minLength: 1
        buyerNotes:
          type: string
          description: Optional message from the buyer to the merchant (max 500 chars)
          maxLength: 500
      required: [buyerId]

    MerchantActionBody:
      type: object
      description: Request body for confirm and complete actions — requires the merchant's store ID.
      properties:
        storeId:
          type: string
          description: Store ID of the acting merchant
          minLength: 1
      required: [storeId]

    DeclineReservationBody:
      type: object
      description: Request body for merchant decline action.
      properties:
        storeId:
          type: string
          description: Store ID of the acting merchant
          minLength: 1
        cancellationReason:
          type: string
          description: Optional reason shown to the buyer (max 500 chars)
          maxLength: 500
      required: [storeId]

    CancelReservationBody:
      type: object
      description: >
        Request body for cancellation. Provide exactly one of buyerId (buyer cancels)
        or storeId (merchant cancels). The other party will be notified.
      properties:
        buyerId:
          type: string
          description: Buyer device UUID (when the buyer is cancelling)
        storeId:
          type: string
          description: Store ID (when the merchant is cancelling)
        cancellationReason:
          type: string
          description: Optional reason (max 500 chars)
          maxLength: 500

    ReservationConflictError:
      type: object
      description: Returned when a reservation cannot be created due to a conflict.
      properties:
        error: { type: string }
        code:
          type: string
          description: "DUPLICATE_RESERVATION (same buyer) or PRODUCT_ALREADY_RESERVED (another buyer)"
      required: [error, code]
