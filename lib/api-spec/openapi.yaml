openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.3.0
  description: MOB HUB Egypt — Mobile Phone Marketplace API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: stores
    description: Store operations
  - name: products
    description: Product operations
  - name: phoneSpecs
    description: Phone specification operations
  - name: categories
    description: Category operations
  - name: dashboard
    description: Seller dashboard operations
  - name: messaging
    description: Buyer–Seller conversation and messaging
  - name: notifications
    description: Centralized notification platform (buyer + seller)
  - name: reservations
    description: Product reservation workflow (buyer browses → reserves → visits physical store)

paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /stores:
    get:
      operationId: getStores
      tags: [stores]
      summary: List stores
      parameters:
        - name: search
          in: query
          schema: { type: string }
        - name: governorate
          in: query
          schema: { type: string }
        - name: isVerified
          in: query
          schema: { type: string }
        - name: ids
          in: query
          description: Comma-separated store IDs
          schema: { type: string }
        - name: sort
          in: query
          schema: { type: string }
      responses:
        "200":
          description: Array of stores
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/StoreDto"

  /stores/{id}:
    get:
      operationId: getStore
      tags: [stores]
      summary: Get store by ID
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Store
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StoreDto"
        "404":
          description: Not found

  /stores/{id}/products:
    get:
      operationId: getStoreProducts
      tags: [stores]
      summary: Get products for a store
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Products
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ProductDto"

  /stores/{id}/reviews:
    get:
      operationId: getStoreReviews
      tags: [stores]
      summary: Get reviews for a store
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Reviews
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ReviewDto"
    post:
      operationId: createStoreReview
      tags: [stores]
      summary: Submit a review for a store
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateReviewBody"
      responses:
        "201":
          description: Created review
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReviewDto"
        "400":
          description: Validation error
        "404":
          description: Store not found
        "409":
          description: Duplicate review

  /reviews/{id}:
    put:
      operationId: updateReview
      tags: [stores]
      summary: Update an existing review
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateReviewBody"
      responses:
        "200":
          description: Updated review
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReviewDto"
        "400":
          description: Validation error
        "403":
          description: Not your review
        "404":
          description: Review not found
    delete:
      operationId: deleteReview
      tags: [stores]
      summary: Delete a review
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
        - name: userId
          in: query
          required: true
          schema: { type: string }
      responses:
        "204":
          description: Deleted
        "403":
          description: Not your review
        "404":
          description: Review not found

  /products:
    get:
      operationId: getProducts
      tags: [products]
      summary: List / filter products
      parameters:
        - name: storeId
          in: query
          schema: { type: string }
        - name: category
          in: query
          schema: { type: string }
        - name: isNew
          in: query
          schema: { type: string }
        - name: isBestSeller
          in: query
          schema: { type: string }
        - name: isFeatured
          in: query
          schema: { type: string }
        - name: condition
          in: query
          schema: { type: string }
        - name: ids
          in: query
          description: Comma-separated product IDs
          schema: { type: string }
        - name: excludeId
          in: query
          schema: { type: string }
        - name: search
          in: query
          schema: { type: string }
        - name: brand
          in: query
          schema: { type: string }
      responses:
        "200":
          description: Products
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ProductDto"

  /products/{id}:
    get:
      operationId: getProduct
      tags: [products]
      summary: Get product by ID
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Product
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductDto"
        "404":
          description: Not found

  /phone-specs:
    get:
      operationId: getPhoneSpecs
      tags: [phoneSpecs]
      summary: List all phone specs
      responses:
        "200":
          description: Phone specs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PhoneSpecDto"

  /phone-specs/{id}:
    get:
      operationId: getPhoneSpec
      tags: [phoneSpecs]
      summary: Get phone spec by ID
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Phone spec
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PhoneSpecDto"
        "404":
          description: Not found

  /categories:
    get:
      operationId: getCategories
      tags: [categories]
      summary: List all categories
      responses:
        "200":
          description: Categories
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CategoryDto"

  /dashboard/stats:
    get:
      operationId: getDashboardStats
      tags: [dashboard]
      summary: Get dashboard stats for a store
      parameters:
        - name: storeId
          in: query
          schema: { type: string }
      responses:
        "200":
          description: Dashboard stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardStatsDto"

  /dashboard/orders:
    get:
      operationId: getDashboardOrders
      tags: [dashboard]
      summary: List orders for a store
      parameters:
        - name: storeId
          in: query
          schema: { type: string }
      responses:
        "200":
          description: Orders
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/OrderDto"

  /dashboard/messages:
    get:
      operationId: getDashboardMessages
      tags: [dashboard]
      summary: List messages for a store
      parameters:
        - name: storeId
          in: query
          schema: { type: string }
      responses:
        "200":
          description: Messages
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MessageDto"

  /dashboard/reviews:
    get:
      operationId: getDashboardReviews
      tags: [dashboard]
      summary: List reviews for a store (dashboard)
      parameters:
        - name: storeId
          in: query
          schema: { type: string }
      responses:
        "200":
          description: Reviews
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ReviewDto"

  /dashboard/products:
    post:
      operationId: createDashboardProduct
      tags: [dashboard]
      summary: Create a new product
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateProductBody"
      responses:
        "201":
          description: Created product
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductDto"
        "400":
          description: Validation error

  # ───────────────────────────────────────────────────────────────────────────
  # Messaging
  # ───────────────────────────────────────────────────────────────────────────

  /conversations:
    get:
      operationId: getConversations
      tags: [messaging]
      summary: List conversations (by buyerId or storeId)
      parameters:
        - name: buyerId
          in: query
          schema: { type: string }
        - name: storeId
          in: query
          schema: { type: string }
      responses:
        "200":
          description: List of conversations
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ConversationDto"
        "400":
          description: At least one of buyerId or storeId is required
    post:
      operationId: createConversation
      tags: [messaging]
      summary: Create or retrieve an existing conversation (idempotent)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateConversationBody"
      responses:
        "200":
          description: Existing conversation returned
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConversationDto"
        "201":
          description: New conversation created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConversationDto"
        "400":
          description: Validation error
        "404":
          description: Store not found

  /conversations/{id}:
    get:
      operationId: getConversation
      tags: [messaging]
      summary: Get a conversation by ID (participant check required)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
        - name: buyerId
          in: query
          schema: { type: string }
        - name: storeId
          in: query
          schema: { type: string }
      responses:
        "200":
          description: Conversation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConversationDto"
        "403":
          description: Not a participant
        "404":
          description: Not found

  /conversations/{id}/messages:
    get:
      operationId: getConversationMessages
      tags: [messaging]
      summary: List messages in a conversation
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
        - name: buyerId
          in: query
          schema: { type: string }
        - name: storeId
          in: query
          schema: { type: string }
      responses:
        "200":
          description: Messages
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ChatMessageDto"
        "403":
          description: Not a participant
        "404":
          description: Conversation not found
    post:
      operationId: sendMessage
      tags: [messaging]
      summary: Send a message in a conversation
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SendMessageBody"
      responses:
        "201":
          description: Message sent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChatMessageDto"
        "400":
          description: Validation error
        "403":
          description: Not a participant
        "404":
          description: Conversation not found

  # ───────────────────────────────────────────────────────────────────────────
  # Notifications
  # ───────────────────────────────────────────────────────────────────────────

  /notifications:
    get:
      operationId: getNotifications
      tags: [notifications]
      summary: List notifications for a recipient (buyer device UUID or seller storeId)
      parameters:
        - name: userId
          in: query
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Notifications, newest first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/NotificationDto"
        "400":
          description: userId is required

  /notifications/unread-count:
    get:
      operationId: getNotificationsUnreadCount
      tags: [notifications]
      summary: Get the unread notification count for a recipient
      parameters:
        - name: userId
          in: query
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Unread count
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UnreadCountDto"
        "400":
          description: userId is required

  /notifications/read-all:
    patch:
      operationId: markAllNotificationsRead
      tags: [notifications]
      summary: Mark every notification read for a recipient
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MarkAllNotificationsReadBody"
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                required: [success]
        "400":
          description: userId is required

  /notifications/{id}:
    get:
      operationId: getNotification
      tags: [notifications]
      summary: Get a single notification by ID
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
        - name: userId
          in: query
          required: true
          description: Recipient ID — must match the notification owner
          schema: { type: string }
      responses:
        "200":
          description: Notification
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotificationDto"
        "403":
          description: Forbidden — userId does not match notification owner
        "404":
          description: Notification not found
    delete:
      operationId: deleteNotification
      tags: [notifications]
      summary: Delete a notification
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
        - name: userId
          in: query
          required: true
          description: Recipient ID — must match the notification owner
          schema: { type: string }
      responses:
        "204":
          description: Deleted
        "403":
          description: Forbidden — userId does not match notification owner
        "404":
          description: Notification not found

  /notifications/{id}/read:
    patch:
      operationId: markNotificationRead
      tags: [notifications]
      summary: Mark a single notification read
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
        - name: userId
          in: query
          required: true
          description: Recipient ID — must match the notification owner
          schema: { type: string }
      responses:
        "200":
          description: Updated notification
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotificationDto"
        "403":
          description: Forbidden — userId does not match notification owner
        "404":
          description: Notification not found

  # ───────────────────────────────────────────────────────────────────────────
  # Reservations
  # ───────────────────────────────────────────────────────────────────────────

  /products/{id}/reserve:
    post:
      operationId: createReservation
      tags: [reservations]
      summary: Create a reservation for a product
      description: >
        A buyer submits a reservation request for a specific product.
        The product must exist. Only one active (pending or confirmed) reservation
        is allowed per product at any time — the DB enforces this with a unique
        partial index. A conversation thread is automatically created or reused.
        Sends a `reservation_created` notification to the merchant.
      parameters:
        - name: id
          in: path
          required: true
          description: Product ID to reserve
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateReservationBody"
            example:
              buyerId: "device_abc123"
              buyerNotes: "هل يمكن تجربة الجهاز قبل الشراء؟"
      responses:
        "201":
          description: Reservation created successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReservationDto"
        "400":
          description: Validation error — buyerId is required
        "404":
          description: Product not found
        "409":
          description: Conflict — product already has an active reservation, or buyer has a duplicate
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReservationConflictError"

  /reservations:
    get:
      operationId: getReservations
      tags: [reservations]
      summary: List reservations for a buyer or merchant
      description: >
        Returns reservations filtered by buyerId (buyer's device UUID) or storeId
        (merchant). At least one must be provided. Supports optional status filter
        and pagination via limit/offset.
      parameters:
        - name: buyerId
          in: query
          description: Buyer device UUID — returns all reservations made by this buyer
          schema: { type: string }
        - name: storeId
          in: query
          description: Store ID — returns all reservations for this store's products
          schema: { type: string }
        - name: status
          in: query
          description: Filter by reservation status (pending, confirmed, declined, cancelled, expired, completed)
          schema: { type: string }
        - name: limit
          in: query
          description: Maximum number of results (1–50, default 20)
          schema: { type: integer }
        - name: offset
          in: query
          description: Pagination offset (default 0)
          schema: { type: integer }
      responses:
        "200":
          description: List of reservations ordered by createdAt descending
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ReservationDto"
        "400":
          description: At least one of buyerId or storeId is required

  /reservations/{id}:
    get:
      operationId: getReservation
      tags: [reservations]
      summary: Get a single reservation by ID
      description: >
        Fetches a reservation by its ID. Either buyerId or storeId must be provided
        for access control — the API returns 404 (not 403) when the caller is not
        a participant to prevent ID enumeration.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
        - name: buyerId
          in: query
          description: Buyer device UUID (required if caller is the buyer)
          schema: { type: string }
        - name: storeId
          in: query
          description: Store ID (required if caller is the merchant)
          schema: { type: string }
      responses:
        "200":
          description: Reservation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReservationDto"
        "404":
          description: Reservation not found or caller is not a participant

  /reservations/{id}/confirm:
    patch:
      operationId: confirmReservation
      tags: [reservations]
      summary: Merchant confirms a pending reservation
      description: >
        Transitions the reservation from `pending` → `confirmed`.
        Only the owning store may confirm. Posts a system message to the linked
        conversation and sends a `reservation_confirmed` notification to the buyer.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MerchantActionBody"
            example:
              storeId: "s1"
      responses:
        "200":
          description: Updated reservation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReservationDto"
        "400":
          description: storeId is required
        "403":
          description: Forbidden — caller is not the owning store
        "404":
          description: Reservation not found
        "422":
          description: Invalid state transition — reservation is not in pending status

  /reservations/{id}/decline:
    patch:
      operationId: declineReservation
      tags: [reservations]
      summary: Merchant declines a pending reservation
      description: >
        Transitions the reservation from `pending` → `declined`.
        Only the owning store may decline. Sends a `reservation_declined`
        notification to the buyer.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeclineReservationBody"
            example:
              storeId: "s1"
              cancellationReason: "الجهاز غير متاح حالياً"
      responses:
        "200":
          description: Updated reservation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReservationDto"
        "400":
          description: storeId is required
        "403":
          description: Forbidden — caller is not the owning store
        "404":
          description: Reservation not found
        "422":
          description: Invalid state transition

  /reservations/{id}/cancel:
    patch:
      operationId: cancelReservation
      tags: [reservations]
      summary: Cancel a reservation (buyer or merchant)
      description: >
        Transitions the reservation from `pending` or `confirmed` → `cancelled`.
        Either the buyer (buyerId) or the merchant (storeId) may cancel.
        Provide exactly one of buyerId or storeId. The other party receives a
        `reservation_cancelled` notification.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CancelReservationBody"
            example:
              buyerId: "device_abc123"
              cancellationReason: "غيّرت رأيي"
      responses:
        "200":
          description: Updated reservation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReservationDto"
        "400":
          description: Either buyerId or storeId is required
        "404":
          description: Reservation not found or caller is not a participant
        "422":
          description: Invalid state transition — terminal statuses cannot be cancelled

  /reservations/{id}/complete:
    patch:
      operationId: completeReservation
      tags: [reservations]
      summary: Merchant marks a confirmed reservation as completed
      description: >
        Transitions the reservation from `confirmed` → `completed`.
        Only the owning store may complete. Represents the buyer visiting
        the physical store. Sends a `reservation_completed` notification to the buyer.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MerchantActionBody"
            example:
              storeId: "s1"
      responses:
        "200":
          description: Updated reservation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReservationDto"
        "400":
          description: storeId is required
        "403":
          description: Forbidden — caller is not the owning store
        "404":
          description: Reservation not found
        "422":
          description: Invalid state transition — reservation is not in confirmed status

  /conversations/{id}/read:
    patch:
      operationId: markConversationRead
      tags: [messaging]
      summary: Mark a conversation as read for a participant
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MarkReadBody"
      responses:
        "200":
          description: Updated conversation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConversationDto"
        "400":
          description: Invalid readerType
        "404":
          description: Conversation not found

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required: [status]

    StoreDto:
      type: object
      properties:
        id: { type: string }
        nameAr: { type: string }
        nameEn: { type: string }
        descriptionAr: { type: string }
        descriptionEn: { type: string }
        logoColor: { type: string }
        logoInitial: { type: string }
        coverGradient:
          type: array
          items: { type: string }
        rating: { type: number }
        reviewsCount: { type: integer }
